<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SunnyPanel</title>

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/site.webmanifest?v=5" />
    <meta name="theme-color" content="#0b1220" />

    <!-- Social preview -->
    <meta property="og:title" content="SunnyPanel" />
    <meta property="og:description" content="GetKey page for SunnyPanel" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SunnyPanel" />
    <meta name="twitter:description" content="GetKey page for SunnyPanel" />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"><main id="sunny-startup" style="max-width:560px;margin:48px auto;padding:24px;font-family:system-ui;line-height:1.6;color:#0f172a"><h1 style="font-size:24px">SunnyMod</h1><p id="sunny-startup-message" role="status">Đang tải trang…</p><button id="sunny-startup-retry" hidden style="padding:12px 20px;background:#fbbf24;border:0;border-radius:12px;font-size:16px">Tải lại trang</button><noscript>Bật JavaScript trong trình duyệt để sử dụng trang.</noscript></main></div>
    <script>
      (() => {
        const root=document.getElementById('root');
        function fail(code){
          if(!document.getElementById('sunny-startup'))return;
          document.getElementById('sunny-startup-message').textContent='Chưa tải được trang. Mã lỗi: '+code+'. Bấm tải lại để lấy phiên bản mới.';
          document.getElementById('sunny-startup-retry').hidden=false;
        }
        document.getElementById('sunny-startup-retry').onclick=()=>{const url=new URL(location.href);url.searchParams.set('_reload',String(Date.now()));location.replace(url.href);};
        window.addEventListener('sunny:boot-error',e=>fail(['ASSET_LOAD','APP_CONFIG','APP_LOAD'].includes(e.detail)?e.detail:'APP_LOAD'));
        window.addEventListener('error',e=>{if(e.target&&e.target.tagName==='SCRIPT')fail('SCRIPT_LOAD');},true);
        const timer=setTimeout(()=>fail('LOAD_TIMEOUT'),15000);
        const observer=new MutationObserver(()=>{if(!document.getElementById('sunny-startup')){clearTimeout(timer);observer.disconnect();root.dataset.ready='true';}});
        observer.observe(root,{childList:true,subtree:true});
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
