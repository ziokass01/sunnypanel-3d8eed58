name: Apply strict Link4M browser hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-link4m-browser-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Link4M flow without direct gate fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          backend_files = [
              Path('supabase/functions/free-start/index.ts'),
              Path('supabase/functions/free-gate/index.ts'),
          ]

          old_strict = '''function shortlinkStrictProviderEnabled() {
            // Older deployments may still have FREE_SHORTLINK_FAIL_OPEN=false saved as
            // a secret. That stale flag must not keep the whole Free Key flow broken when
            // Link4M is blocked by Cloudflare. Strict mode now requires an explicit new
            // secret: FREE_SHORTLINK_STRICT_PROVIDER=true.
            const raw = Deno.env.get("FREE_SHORTLINK_STRICT_PROVIDER");
            return ["1", "true", "yes", "on"].includes(String(raw ?? "").trim().toLowerCase());
          }'''
          new_strict = '''function shortlinkStrictProviderEnabled() {
            // Free Key must never bypass the configured shortener and open the gate directly.
            // Keep this fail-closed even when an old environment still contains fail-open flags.
            return true;
          }'''

          old_link4m_start = '''  if (kind === "link4m") {
            const base = apiUrl || "https://link4m.co/api-shorten/v2";
            requestUrl = renderTemplate(base.includes("{url") || base.includes("{token") ? base : `${base}${base.includes("?") ? "&" : "?"}api={token}&url={url_enc}`, gateUrl, token);
          } else if (kind === "nhapma") {'''
          new_link4m_start = '''  if (kind === "link4m") {
            if (!token) throw new Error("SHORTLINK_TOKEN_MISSING");
            // Link4M is currently challenging requests from Supabase Edge IPs with HTML.
            // Use Link4M's official browser Full Page Script instead. The secret-bearing
            // values stay in the URL fragment, so they are not sent to our web server or
            // copied into normal referrer headers.
            const bridge = new URL(`${publicBase()}/free/link4m-bridge`);
            bridge.hash = new URLSearchParams({ api: token, url: gateUrl }).toString();
            return bridge.toString();
          } else if (kind === "nhapma") {'''

          old_link4m_gate = '''  if (kind === "link4m") {
            const base = apiUrl || "https://link4m.co/api-shorten/v2";
            requestUrl = renderTemplate(base.includes("{url") || base.includes("{token") ? base : `${base}${base.includes("?") ? "&" : "?"}api={token}&url={url_enc}`, gateUrl, token);
          } else if (kind === "nhapma") {'''
          new_link4m_gate = new_link4m_start

          for path in backend_files:
              content = path.read_text(encoding='utf-8')
              if content.count(old_strict) != 1:
                  raise SystemExit(f'{path}: strict guard pattern count != 1')
              content = content.replace(old_strict, new_strict, 1)
              old = old_link4m_start if path.name == 'index.ts' and 'free-start' in str(path) else old_link4m_gate
              if content.count(old) != 1:
                  raise SystemExit(f'{path}: Link4M branch pattern count != 1')
              content = content.replace(old, new_link4m_start, 1)
              path.write_text(content, encoding='utf-8')

          page = Path('src/pages/FreeLink4MBridge.tsx')
          content = page.read_text(encoding='utf-8')
          old_parse = '''  const bridge = useMemo(() => {
            const apiToken = String(params.get("api") ?? "").trim();
            const targetValue = String(params.get("url") ?? "").trim();
            if (!apiToken || !targetValue) return null;'''
          new_parse = '''  const bridge = useMemo(() => {
            const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
            const apiToken = String(hashParams.get("api") ?? params.get("api") ?? "").trim();
            const targetValue = String(hashParams.get("url") ?? params.get("url") ?? "").trim();
            if (!apiToken || !targetValue) return null;
            if (hashParams.has("api") || hashParams.has("url")) {
              window.history.replaceState(null, "", window.location.pathname + window.location.search);
            }'''
          if content.count(old_parse) != 1:
              raise SystemExit('FreeLink4MBridge.tsx: parser pattern count != 1')
          content = content.replace(old_parse, new_parse, 1)
          page.write_text(content, encoding='utf-8')
          PY

      - name: Verify frontend and Edge Functions
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
          npx --yes deno@latest check \
            supabase/functions/free-start/index.ts \
            supabase/functions/free-gate/index.ts

      - name: Commit verified hotfix
        run: |
          rm -f .github/workflows/apply-link4m-browser-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Link4M Cloudflare challenge without bypassing gate"
          git push origin HEAD:main
