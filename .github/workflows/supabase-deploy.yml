name: Manual Supabase DB Push + Edge Functions

on:
  workflow_dispatch:
    inputs:
      run_db_push:
        description: "Run supabase db push"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$PROJECT_REF" || { echo "::error::Missing SUPABASE_PROJECT_REF"; exit 1; }

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration list
        run: supabase migration list

      - name: Repair legacy migration markers 20260327 and 20260327120000
        if: ${{ github.event.inputs.run_db_push == 'true' }}
        run: |
          supabase migration repair --status reverted 20260327 || true
          supabase migration repair --status reverted 20260327120000 || true

      - name: Push migrations
        id: db_push
        if: ${{ github.event.inputs.run_db_push == 'true' }}
        continue-on-error: true
        run: yes | supabase db push --include-all

      - name: Deploy public/admin Edge Functions with verify_jwt disabled
        run: |
          set -euo pipefail
          no_verify_functions=(
            admin-free-block admin-free-delete-issued admin-free-delete-session admin-free-test admin-free-shortlinks
            admin-rent admin-rent-integrations free-admin-test free-close free-config free-gate
            free-resolve free-reveal free-start generate-license-key rent-user rent-verify-key
            reset-key server-app-runtime server-app-runtime-ops verify-key fake-lag-check fake-lag-auth
          )
          for fn in "${no_verify_functions[@]}"; do
            if [ -d "supabase/functions/${fn}" ]; then
              echo "Deploying ${fn} with --no-verify-jwt"
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
            fi
          done

      - name: Deploy remaining Edge Functions with default verify_jwt
        run: |
          set -euo pipefail
          remaining_functions=(mobile-auth-email)
          for fn in "${remaining_functions[@]}"; do
            if [ -d "supabase/functions/${fn}" ]; then
              echo "Deploying ${fn}"
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            fi
          done

      - name: Set function secrets
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            ADMIN_EMAILS="${{ secrets.ADMIN_EMAILS }}" \
            PUBLIC_BASE_URL="${{ secrets.PUBLIC_BASE_URL }}" \
            VERIFY_HMAC_SECRET="${{ secrets.VERIFY_HMAC_SECRET }}" \
            TURNSTILE_SITE_KEY="${{ secrets.TURNSTILE_SITE_KEY }}" \
            TURNSTILE_SECRET_KEY="${{ secrets.TURNSTILE_SECRET_KEY }}" \
            RUNTIME_OPS_ADMIN_KEY="${{ secrets.RUNTIME_OPS_ADMIN_KEY }}" \
            FREE_SHORTLINK_STRICT_PROVIDER="true"

      - name: Warn if db push failed
        if: ${{ github.event.inputs.run_db_push == 'true' && steps.db_push.outcome == 'failure' }}
        run: |
          echo "::warning::supabase db push failed. Functions were deployed. If the Free Key provider table is missing, run HOTFIX_FREE_KEY_RUN_IN_SQL_EDITOR.sql in Supabase SQL Editor."
          exit 0
