name: Fix Link4M provider rotation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: link4m-provider-rotation-hotfix
  cancel-in-progress: false

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Link4M detection before provider-specific branches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('supabase/functions/free-start/index.ts'),
              Path('supabase/functions/free-gate/index.ts'),
          ]

          pattern = re.compile(
              r'''  let requestUrl = "";\n.*?\n  \} else if \(kind === "nhapma"\) \{''',
              re.S,
          )

          replacement = '''  const providerHint = [
            kind,
            text(provider?.name, 128),
            text(provider?.note, 512),
            rawApiUrl,
            apiUrl,
          ].join(" ").toLowerCase();
          const isLink4M = providerHint.includes("link4m");

          let requestUrl = "";
          if (isLink4M) {
            if (!token) throw new Error("SHORTLINK_TOKEN_MISSING");
            // Several legacy Link4M rows were saved under another provider kind.
            // Detect them by all row metadata before traffic68/custom handling so
            // round-robin cannot alternate between a working /st row and an old
            // server-side api-shorten row that Cloudflare challenges.
            const outbound = new URL("https://link4m.co/st");
            outbound.searchParams.set("api", token);
            outbound.searchParams.set("url", gateUrl);
            return outbound.toString();
          }
          if (kind === "traffic68") {
            const base = apiUrl || "https://traffic68.com/api/quicklink/st";
            return `${base}${base.includes("?") ? "&" : "?"}api=${encodeURIComponent(token)}&url=${encodeURIComponent(gateUrl)}`;
          }
          if (kind === "nhapma") {'''

          for path in paths:
              source = path.read_text(encoding='utf-8')
              patched, count = pattern.subn(replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one shortener branch, found {count}')

              required = [
                  'const isLink4M = providerHint.includes("link4m")',
                  'new URL("https://link4m.co/st")',
                  'outbound.searchParams.set("api", token)',
                  'outbound.searchParams.set("url", gateUrl)',
                  'if (kind === "traffic68")',
                  'if (kind === "nhapma")',
              ]
              for needle in required:
                  if needle not in patched:
                      raise SystemExit(f'{path}: missing verification marker: {needle}')

              if patched.count('new URL("https://link4m.co/st")') != 1:
                  raise SystemExit(f'{path}: unexpected number of Link4M /st branches')

              path.write_text(patched, encoding='utf-8')
          PY

      - name: Verify changed functions
        run: |
          set -euo pipefail
          git diff --check
          npx --yes deno@latest check \
            supabase/functions/free-start/index.ts \
            supabase/functions/free-gate/index.ts

      - name: Validate deployment secrets
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$PROJECT_REF" || { echo "::error::Missing SUPABASE_PROJECT_REF"; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Deploy only the two Free Key functions
        run: |
          set -euo pipefail
          supabase functions deploy free-start --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy free-gate --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Commit verified hotfix and remove one-shot files
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-link4m-provider-rotation.yml
          rm -f docs/link4m-provider-rotation-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix intermittent Link4M failures across rotated provider rows"
          git push origin HEAD:main
