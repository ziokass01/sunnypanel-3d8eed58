name: Deploy Supabase Migrations + Edge Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Validate required deployment secrets
        shell: bash
        env:
          VERIFY_REQUEST_HMAC_SECRET_INPUT: ${{ secrets.VERIFY_REQUEST_HMAC_SECRET }}
          VERIFY_HMAC_SECRET_INPUT: ${{ secrets.VERIFY_HMAC_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$PROJECT_REF" || { echo "::error::Missing SUPABASE_PROJECT_REF"; exit 1; }
          if [ -z "$VERIFY_REQUEST_HMAC_SECRET_INPUT" ] && [ -z "$VERIFY_HMAC_SECRET_INPUT" ]; then
            echo "::error::Missing both VERIFY_REQUEST_HMAC_SECRET and VERIFY_HMAC_SECRET. Keep the current released-menu HMAC value in one of these GitHub secrets."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations before functions
        run: |
          set -euo pipefail
          yes | supabase db push --include-all

      - name: Sync function secrets before deployment
        shell: bash
        env:
          VERIFY_REQUEST_HMAC_SECRET_INPUT: ${{ secrets.VERIFY_REQUEST_HMAC_SECRET }}
          VERIFY_HMAC_SECRET_INPUT: ${{ secrets.VERIFY_HMAC_SECRET }}
          VERIFY_GATEWAY_SHARED_SECRET_INPUT: ${{ secrets.VERIFY_GATEWAY_SHARED_SECRET }}
          VERIFY_RESPONSE_ECDSA_PRIVATE_KEY_PEM_INPUT: ${{ secrets.VERIFY_RESPONSE_ECDSA_PRIVATE_KEY_PEM }}
          ADMIN_EMAILS_INPUT: ${{ secrets.ADMIN_EMAILS }}
          PUBLIC_BASE_URL_INPUT: ${{ secrets.PUBLIC_BASE_URL }}
          TURNSTILE_SITE_KEY_INPUT: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY_INPUT: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RUNTIME_OPS_ADMIN_KEY_INPUT: ${{ secrets.RUNTIME_OPS_ADMIN_KEY }}
        run: |
          set -euo pipefail

          request_hmac="$VERIFY_REQUEST_HMAC_SECRET_INPUT"
          if [ -z "$request_hmac" ]; then
            request_hmac="$VERIFY_HMAC_SECRET_INPUT"
          fi

          secret_args=(
            "VERIFY_REQUEST_HMAC_SECRET=$request_hmac"
            "VERIFY_HMAC_SECRET=$request_hmac"
            "VERIFY_REQUIRE_GATEWAY=1"
            "VERIFY_REQUIRED_BUILD_ID=sunny-v34-ac-20260721"
            "VERIFY_PRODUCT_ID=sunny-free-fire"
            "VERIFY_RESPONSE_ECDSA_KEY_ID=sunny-p256-2026-07-b"
            "VERIFY_SESSION_TTL_SECONDS=900"
            "VERIFY_REQUIRE_DEVICE_KEY=0"
            "FREE_SHORTLINK_STRICT_PROVIDER=true"
          )

          append_if_set() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              secret_args+=("$name=$value")
            fi
          }

          append_if_set "VERIFY_GATEWAY_SHARED_SECRET" "$VERIFY_GATEWAY_SHARED_SECRET_INPUT"
          append_if_set "VERIFY_RESPONSE_ECDSA_PRIVATE_KEY_PEM" "$VERIFY_RESPONSE_ECDSA_PRIVATE_KEY_PEM_INPUT"
          append_if_set "ADMIN_EMAILS" "$ADMIN_EMAILS_INPUT"
          append_if_set "PUBLIC_BASE_URL" "$PUBLIC_BASE_URL_INPUT"
          append_if_set "TURNSTILE_SITE_KEY" "$TURNSTILE_SITE_KEY_INPUT"
          append_if_set "TURNSTILE_SECRET_KEY" "$TURNSTILE_SECRET_KEY_INPUT"
          append_if_set "RUNTIME_OPS_ADMIN_KEY" "$RUNTIME_OPS_ADMIN_KEY_INPUT"

          supabase secrets set --project-ref "$PROJECT_REF" "${secret_args[@]}"

      - name: Deploy public/admin Edge Functions with verify_jwt disabled
        run: |
          set -euo pipefail
          no_verify_functions=(
            admin-free-block admin-free-delete-issued admin-free-delete-session admin-free-test admin-free-shortlinks
            admin-rent admin-rent-integrations free-admin-test free-close free-config free-gate
            free-resolve free-reveal free-start generate-license-key rent-user rent-verify-key
            reset-key server-app-runtime server-app-runtime-ops verify-key fake-lag-check fake-lag-auth
          )
          for fn in "${no_verify_functions[@]}"; do
            if [ -d "supabase/functions/${fn}" ]; then
              echo "Deploying ${fn} with --no-verify-jwt"
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
            fi
          done

      - name: Deploy remaining Edge Functions with default verify_jwt
        run: |
          set -euo pipefail
          remaining_functions=(mobile-auth-email)
          for fn in "${remaining_functions[@]}"; do
            if [ -d "supabase/functions/${fn}" ]; then
              echo "Deploying ${fn}"
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            fi
          done
