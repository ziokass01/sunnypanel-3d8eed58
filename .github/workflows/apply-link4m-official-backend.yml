name: Apply Link4M official backend patch

on:
  push:
    branches:
      - codex/fix-link4m-official-full-script
    paths:
      - .github/workflows/apply-link4m-official-backend.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-link4m-official-full-script
          fetch-depth: 0

      - name: Apply reviewed backend patch
        env:
          PATCH_GZ_B64: 
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/link4m-backend.patch
          git apply --check /tmp/link4m-backend.patch
          git apply /tmp/link4m-backend.patch

      - name: Verify changed backend files
        run: |
          npx --yes deno@latest check supabase/functions/free-start/index.ts supabase/functions/free-gate/index.ts

      - name: Commit backend fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/free-start/index.ts supabase/functions/free-gate/index.ts
          git commit -m "Fix Link4M with official full-page script flow"
          git push origin HEAD:codex/fix-link4m-official-full-script
